<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explorador de Personajes</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="encabezado">
    <h1 data-texto="titulo"></h1>
    <p data-texto="subtitulo"></p>
  </header>

  <main class="contenedor">
    <!-- Controles de búsqueda y filtros -->
    <form id="formulario" class="controles" role="search">
      <div class="campo campo-busqueda">
        <label for="buscar" data-texto="etiquetaBuscar"></label>
        <input type="search" id="buscar" autocomplete="off">
      </div>
      <div class="campo">
        <label for="filtro-estado" data-texto="etiquetaEstado"></label>
        <select id="filtro-estado"></select>
      </div>
      <div class="campo">
        <label for="filtro-genero" data-texto="etiquetaGenero"></label>
        <select id="filtro-genero"></select>
      </div>
      <button type="reset" id="limpiar" class="boton boton-secundario" data-texto="limpiar"></button>
    </form>

    <!-- Resumen de resultados (lo leen también los lectores de pantalla) -->
    <p id="resumen" class="resumen" aria-live="polite"></p>

    <!-- Aquí se muestran los mensajes de carga, vacío y error -->
    <section id="mensaje" class="mensaje" aria-live="polite" hidden></section>

    <!-- Aquí se crean dinámicamente las tarjetas de personajes -->
    <section id="tarjetas" class="tarjetas"></section>

    <!-- Paginación -->
    <nav id="paginacion" class="paginacion" hidden>
      <button type="button" id="anterior" class="boton" data-texto="anterior"></button>
      <span id="pagina-actual"></span>
      <button type="button" id="siguiente" class="boton" data-texto="siguiente"></button>
    </nav>
  </main>

  <!-- Ventana de detalle de un personaje -->
  <dialog id="detalle" class="detalle">
    <div id="detalle-contenido"></div>
    <button type="button" id="cerrar-detalle" class="boton" data-texto="cerrar"></button>
  </dialog>

  <footer class="pie">
    <p data-texto="fuente"></p>
  </footer>

  <!-- El orden importa: primero los textos, luego la API, la interfaz y al final la app -->
  <script src="js/textos.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
